<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบห้องครัว - ร้านส้มตำ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Prompt', Tahoma, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f4f6f9;
            color: #333;
        }
        h1 { text-align: center; color: #d32f2f; margin-bottom: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section-title { font-size: 20px; font-weight: bold; margin: 20px 0 10px; color: #444; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .order-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-left: 6px solid #ff9800;
            position: relative;
        }
        .order-card.cooking { border-left-color: #2196f3; }
        .order-card.done { border-left-color: #4caf50; opacity: 0.8; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; }
        .queue-badge { background: #ff9800; color: white; padding: 4px 10px; border-radius: 20px; font-size: 16px; }
        .order-card.cooking .queue-badge { background: #2196f3; }
        .order-card.done .queue-badge { background: #4caf50; }
        .item-list { margin: 10px 0; padding-left: 20px; font-size: 14px; }
        .item-list li { margin-bottom: 4px; }
        .options { font-size: 12px; color: #666; margin-left: 10px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 15px; }
        button {
            flex: 1;
            min-width: 80px;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            color: white;
        }
        .btn-cook { background: #2196f3; }
        .btn-done { background: #4caf50; }
        .btn-cancel { background: #f44336; }
        .btn-print { background: #607d8b; }
        button:active { transform: scale(0.98); }
        .time-ago { font-size: 12px; color: #778; text-align: right; margin-top: 8px; }

        /* ส่วนสำหรับพิมพ์ใบเสร็จ (ซ่อนไว้ปกติ จะแสดงเฉพาะตอนสั่ง Print) */
        @media print {
            body * { visibility: hidden; }
            .print-receipt, .print-receipt * { visibility: visible; }
            .print-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 10px;
                font-size: 14px;
                background: white;
                color: black;
            }
        }
        .print-receipt { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍳 หน้าจอห้องครัว & ควบคุมออร์เดอร์</h1>
        
        <div class="section-title">🔥 ออร์เดอร์ที่ต้องทำ / กำลังทำ</div>
        <div id="active-orders" class="orders-grid">
            <p>กำลังโหลดข้อมูล...</p>
        </div>

        <div class="section-title">✅ ออร์เดอร์ที่เสร็จแล้ว (วันนี้)</div>
        <div id="done-orders" class="orders-grid"></div>
    </div>

    <!-- ส่วนสำหรับพิมพ์ใบเสร็จซ่อนไว้ -->
    <div id="receipt-area" class="print-receipt"></div>

    <script>
        const SUPABASE_URL = "https://zlhgzcvzwvkyaklajkmi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_2PpazCOtie3x28WsnUfu8g_w3hOqSEk";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let previousOrderCount = 0;

        // ระบบเสียงพูดแจ้งเตือน (Text-to-Speech ภาษาไทย)
        function speakNotification(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // หยุดเสียงเก่าก่อนถ้าค้างอยู่
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 1.0; // ความเร็วในการพูด
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function loadKitchenOrders() {
            try {
                const todayStart = new Date();
                todayStart.setHours(0, 0, 0, 0);

                const { data: orders, error } = await db
                    .from('orders')
                    .select('*')
                    .gte('created_at', todayStart.toISOString())
                    .order('id', { ascending: true });

                if (error) throw error;

                const activeContainer = document.getElementById('active-orders');
                const doneContainer = document.getElementById('done-orders');

                activeContainer.innerHTML = '';
                doneContainer.innerHTML = '';

                let activeCount = 0;

                orders.forEach(order => {
                    const status = (order.status || 'pending').toLowerCase();
                    const isDone = ['done', 'completed', 'เสร็จสิ้น', 'พร้อมเสิร์ฟ'].includes(status);
                    const isCooking = ['cooking', 'กำลังทำ'].includes(status);

                    if (!isDone) activeCount++;

                    let itemsHtml = '';
                    let itemsArray = order.items;
                    if (typeof itemsArray === 'string') {
                        try { itemsArray = JSON.parse(itemsArray); } catch (e) { itemsArray = []; }
                    }

                    if (Array.isArray(itemsArray)) {
                        itemsArray.forEach(item => {
                            let optText = '';
                            if (item.selectedExtras && item.selectedExtras.length > 0) {
                                optText += ` + (${item.selectedExtras.join(', ')})`;
                            }
                            if (item.selectedExclusions && item.selectedExclusions.length > 0) {
                                optText += ` [ไม่ใส่: ${item.selectedExclusions.join(', ')}]`;
                            }
                            itemsHtml += `<li><b>${item.name || item.menu_name}</b> x${item.quantity || 1}<div class="options">${optText}</div></li>`;
                        });
                    }

                    const timeStr = new Date(order.created_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                    const card = document.createElement('div');
                    card.className = `order-card ${isCooking ? 'cooking' : ''} ${isDone ? 'done' : ''}`;
                    
                    let actionButtons = '';
                    // ปุ่มพิมพ์ใบเสร็จ มีให้กดทุกสถานะ
                    actionButtons += `<button class="btn-print" onclick='printReceipt(${JSON.stringify(order)})'>🖨️ พิมพ์</button>`;

                    if (!isDone) {
                        if (!isCooking) {
                            actionButtons += `<button class="btn-cook" onclick="updateStatus(${order.id}, 'cooking', '${order.customer_name}')">🔥 เริ่มทำ</button>`;
                        }
                        actionButtons += `<button class="btn-done" onclick="updateStatus(${order.id}, 'done', '${order.customer_name}')">✅ เสร็จแล้ว</button>`;
                        actionButtons += `<button class="btn-cancel" onclick="updateStatus(${order.id}, 'cancelled', '${order.customer_name}')">ยกเลิก</button>`;
                    } else {
                        actionButtons += `<button class="btn-cook" onclick="updateStatus(${order.id}, 'pending', '${order.customer_name}')" style="background:#78909c;">↩️ ทำใหม่</button>`;
                    }

                    card.innerHTML = `
                        <div class="order-header">
                            <span>${order.customer_name || 'ลูกค้าทั่วไป'}</span>
                            <span class="queue-badge">คิวที่ #${order.queue_no || order.id}</span>
                        </div>
                        <div style="font-size: 13px; color: #555; margin-bottom: 6px;">ประเภท: <b>${order.order_type || 'ทานที่ร้าน'}</b></div>
                        <ul class="item-list">${itemsHtml}</ul>
                        <div class="btn-group">${actionButtons}</div>
                        <div class="time-ago">สั่งเมื่อ: ${timeStr}</div>
                    `;

                    if (isDone) {
                        doneContainer.appendChild(card);
                    } else {
                        activeContainer.appendChild(card);
                    }
                });

                if (activeContainer.innerHTML === '') {
                    activeContainer.innerHTML = '<p style="color:#777;">✨ ไม่มีออร์เดอร์ค้างในขณะนี้</p>';
                }
                if (doneContainer.innerHTML === '') {
                    doneContainer.innerHTML = '<p style="color:#777;">ยังไม่มีออร์เดอร์ที่เสร็จแล้วในวันนี้</p>';
                }

                // แจ้งเตือนเสียงเมื่อมีออร์เดอร์ใหม่เข้ามาเพิ่ม
                if (previousOrderCount > 0 && activeCount > previousOrderCount) {
                    speakNotification("มีออร์เดอร์ใหม่เข้ามา กรุณาตรวจสอบ");
                }
                previousOrderCount = activeCount;

            } catch (err) {
                console.error("โหลดออร์เดอร์ไม่สำเร็จ:", err);
            }
        }

        async function updateStatus(orderId, newStatus, customerName) {
            try {
                const { error } = await db
                    .from('orders')
                    .update({ status: newStatus })
                    .eq('id', orderId);

                if (error) {
                    alert('อัปเดตสถานะไม่สำเร็จ: ' + error.message);
                } else {
                    // ส่งเสียงแจ้งเตือนตามสถานะที่เปลี่ยน
                    if (newStatus === 'cooking') {
                        speakNotification(`${customerName} กำลังทำอาหารครับ`);
                    } else if (newStatus === 'done') {
                        speakNotification(`${customerName} ทำเสร็จแล้ว พร้อมเสิร์ฟครับ`);
                    } else if (newStatus === 'cancelled') {
                        speakNotification(`${customerName} ถูกยกเลิก`);
                    }
                    
                    loadKitchenOrders();
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
            }
        }

        // ฟังก์ชันพิมพ์ใบเสร็จ
        function printReceipt(order) {
            let itemsArray = order.items;
            if (typeof itemsArray === 'string') {
                try { itemsArray = JSON.parse(itemsArray); } catch (e) { itemsArray = []; }
            }

            let itemsListHtml = '';
            if (Array.isArray(itemsArray)) {
                itemsArray.forEach(item => {
                    let opt = '';
                    if (item.selectedExtras && item.selectedExtras.length > 0) opt += ` (+${item.selectedExtras.join(', ')})`;
                    if (item.selectedExclusions && item.selectedExclusions.length > 0) opt += ` [ไม่ใส่: ${item.selectedExclusions.join(', ')}]`;
                    
                    itemsListHtml += `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                            <span>${item.name || item.menu_name} x${item.quantity || 1}</span>
                            <span>฿${(item.finalPrice || item.price || 0)}</span>
                        </div>
                        ${opt ? `<div style="font-size:11px; color:#555; margin-left:10px;">${opt}</div>` : ''}
                    `;
                });
            }

            const receiptHtml = `
                <div style="text-align: center; font-family: 'Prompt', sans-serif; width: 300px; margin: 0 auto; color: #000;">
                    <h2>ร้านส้มตำแซ่บสะเดิด</h2>
                    <p style="font-size: 12px; margin: 2px 0;">ใบเสร็จรับเงิน / รายการอาหาร</p>
                    <hr style="border: 1px dashed #000;">
                    <div style="text-align: left; font-size: 13px; margin: 8px 0;">
                        <div><b>หมายเลขคิว:</b> #${order.queue_no || order.id}</div>
                        <div><b>ลูกค้า/โต๊ะ:</b> ${order.customer_name || '-'}</div>
                        <div><b>ประเภท:</b> ${order.order_type || '-'}</div>
                        <div><b>เวลา:</b> ${new Date(order.created_at).toLocaleString('th-TH')}</div>
                    </div>
                    <hr style="border: 1px dashed #000;">
                    <div style="text-align: left; font-size: 13px; margin: 8px 0;">
                        ${itemsListHtml}
                    </div>
                    <hr style="border: 1px dashed #000;">
                    <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; margin: 8px 0;">
                        <span>ยอดรวมทั้งสิ้น</span>
                        <span>฿${order.total_price || 0}</span>
                    </div>
                    <hr style="border: 1px dashed #000;">
                    <p style="font-size: 12px; margin-top: 10px;">🙏 ขอบคุณที่ใช้บริการค่ะ 🙏</p>
                </div>
            `;

            document.getElementById('receipt-area').innerHTML = receiptHtml;
            window.print();
        }

        // โหลดข้อมูลตอนเปิดหน้าเว็บ
        loadKitchenOrders();

        // รีเฟรชข้อมูลทุก 5 วินาที
        setInterval(loadKitchenOrders, 5000);

        // Realtime Listener
        db.channel('public:orders-kitchen')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
              loadKitchenOrders();
          })
          .subscribe();
    </script>
</body>
</html>
